<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" width="1220" height="720" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4a5c"/>
    </marker>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4a5c"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b07219"/>
    </marker>
  </defs>

  <rect width="1220" height="720" fill="#fbfcfd"/>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f1720">Ratchet — architecture</text>
  <text x="40" y="70" font-size="14" fill="#5b6b7d">An agent that catches supplier price drift. Every number is computed by code; the model never does arithmetic.</text>

  <!-- ============ INPUTS ============ -->
  <text x="40" y="118" font-size="11" font-weight="700" fill="#8494a6" letter-spacing="1.2">INPUTS</text>

  <rect x="40" y="132" width="240" height="96" rx="9" fill="#fff" stroke="#d9e1ea" stroke-width="1.5"/>
  <text x="58" y="158" font-size="14" font-weight="600" fill="#0f1720">Incoming price list</text>
  <text x="58" y="180" font-size="12" fill="#5b6b7d">CSV, semicolon, tab or pasted</text>
  <text x="58" y="198" font-size="12" fill="#5b6b7d">headers in English or Albanian</text>
  <text x="58" y="216" font-size="12" fill="#5b6b7d">prices as 2,28 or 2.28</text>

  <rect x="40" y="244" width="240" height="96" rx="9" fill="#fff" stroke="#d9e1ea" stroke-width="1.5"/>
  <text x="58" y="270" font-size="14" font-weight="600" fill="#0f1720">The shop's own data</text>
  <text x="58" y="292" font-size="12" fill="#5b6b7d">price book — what we pay now</text>
  <text x="58" y="310" font-size="12" fill="#5b6b7d">shelf prices, VAT rate</text>
  <text x="58" y="328" font-size="12" fill="#5b6b7d">monthly units, target margin</text>

  <!-- ============ AGENT ============ -->
  <text x="345" y="118" font-size="11" font-weight="700" fill="#8494a6" letter-spacing="1.2">ORCHESTRATION</text>

  <rect x="345" y="132" width="270" height="330" rx="9" fill="#fff" stroke="#c3d0de" stroke-width="1.5"/>
  <rect x="345" y="132" width="270" height="42" rx="9" fill="#eef3f8"/>
  <rect x="345" y="160" width="270" height="14" fill="#eef3f8"/>
  <text x="365" y="159" font-size="14" font-weight="700" fill="#0f1720">Strands Agent</text>

  <text x="365" y="200" font-size="11.5" font-weight="700" fill="#8494a6" letter-spacing=".6">MODEL — SWAPPABLE</text>
  <rect x="365" y="210" width="230" height="66" rx="7" fill="#fdf7ec" stroke="#e8d3ab"/>
  <text x="381" y="232" font-size="11.5" fill="#7a5a1e">Bedrock · Ollama · OpenAI · Anthropic</text>
  <text x="381" y="252" font-size="11.5" fill="#9a7c3e">chooses which tool to call</text>
  <text x="381" y="268" font-size="11.5" fill="#9a7c3e">writes the supplier message</text>

  <text x="365" y="306" font-size="11.5" font-weight="700" fill="#8494a6" letter-spacing=".6">SIX TOOLS</text>
  <text x="365" y="328" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1f4d7a">read_price_list</text>
  <text x="365" y="350" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1f4d7a">compare_to_price_book</text>
  <text x="365" y="372" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1f4d7a">price_the_damage</text>
  <text x="365" y="394" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1f4d7a">check_margin</text>
  <text x="365" y="416" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1f4d7a">buying_history</text>
  <text x="365" y="438" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#8a5a2b">commit_price_book</text>
  <text x="497" y="438" font-size="10.5" fill="#a08050">needs approval</text>

  <!-- ============ CORE ============ -->
  <text x="680" y="118" font-size="11" font-weight="700" fill="#8494a6" letter-spacing="1.2">DETERMINISTIC CORE</text>

  <rect x="680" y="132" width="290" height="330" rx="9" fill="#f4f9f5" stroke="#bcd9c4" stroke-width="1.5"/>
  <rect x="680" y="132" width="290" height="42" rx="9" fill="#e6f2e9"/>
  <rect x="680" y="160" width="290" height="14" fill="#e6f2e9"/>
  <text x="700" y="159" font-size="14" font-weight="700" fill="#14401f">core/ — no model runs here</text>

  <text x="700" y="200" font-size="13" font-weight="600" fill="#14401f">parse</text>
  <text x="750" y="200" font-size="11" fill="#6b8f77">standard library only</text>
  <text x="700" y="219" font-size="11.5" fill="#476b52">delimiter sniffing, header aliases,</text>
  <text x="700" y="235" font-size="11.5" fill="#476b52">both decimal conventions</text>

  <text x="700" y="266" font-size="13" font-weight="600" fill="#14401f">diff</text>
  <text x="700" y="285" font-size="11.5" fill="#476b52">rises, falls, new and withdrawn lines;</text>
  <text x="700" y="301" font-size="11.5" fill="#476b52">movement under 0.5% is noise</text>

  <text x="700" y="332" font-size="13" font-weight="600" fill="#14401f">margin</text>
  <text x="700" y="351" font-size="11.5" fill="#476b52">VAT stripped, target compared,</text>
  <text x="700" y="367" font-size="11.5" fill="#476b52">shelf price to restore it (rounds up)</text>

  <text x="700" y="398" font-size="13" font-weight="600" fill="#14401f">rank</text>
  <text x="700" y="417" font-size="11.5" fill="#476b52">by annual euro impact at real volume,</text>
  <text x="700" y="433" font-size="11.5" fill="#476b52">not by percentage</text>

  <!-- ============ OUTPUTS ============ -->
  <text x="1000" y="118" font-size="11" font-weight="700" fill="#8494a6" letter-spacing="1.2">OUTPUT</text>

  <rect x="1000" y="132" width="180" height="86" rx="9" fill="#fff" stroke="#d9e1ea" stroke-width="1.5"/>
  <text x="1018" y="158" font-size="13" font-weight="600" fill="#0f1720">Ranked findings</text>
  <text x="1018" y="179" font-size="11.5" fill="#5b6b7d">what each change</text>
  <text x="1018" y="195" font-size="11.5" fill="#5b6b7d">costs per year</text>

  <rect x="1000" y="232" width="180" height="86" rx="9" fill="#fff" stroke="#d9e1ea" stroke-width="1.5"/>
  <text x="1018" y="258" font-size="13" font-weight="600" fill="#0f1720">Margin alerts</text>
  <text x="1018" y="279" font-size="11.5" fill="#5b6b7d">broken by this list vs</text>
  <text x="1018" y="295" font-size="11.5" fill="#5b6b7d">already under target</text>

  <rect x="1000" y="332" width="180" height="86" rx="9" fill="#fff" stroke="#d9e1ea" stroke-width="1.5"/>
  <text x="1018" y="358" font-size="13" font-weight="600" fill="#0f1720">Draft reply</text>
  <text x="1018" y="379" font-size="11.5" fill="#5b6b7d">SKU, old, new, %,</text>
  <text x="1018" y="395" font-size="11.5" fill="#5b6b7d">volume, one question</text>

  <!-- arrows -->
  <path d="M282 180 H330 V286 M282 292 H330" fill="none" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#a1)"/>
  <path d="M282 180 H322" fill="none" stroke="#3d4a5c" stroke-width="1.6"/>
  <path d="M330 240 H341" fill="none" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#a1)"/>
  <path d="M617 297 H676" fill="none" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="622" y="288" font-size="10.5" fill="#5b6b7d">tool call</text>
  <path d="M676 320 H619" fill="none" stroke="#3d4a5c" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a1)"/>
  <text x="622" y="338" font-size="10.5" fill="#5b6b7d">typed result</text>

  <path d="M972 175 H996" fill="none" stroke="#2f7a44" stroke-width="1.6" marker-end="url(#a1)"/>
  <path d="M972 275 H996" fill="none" stroke="#2f7a44" stroke-width="1.6" marker-end="url(#a1)"/>
  <path d="M617 380 C 640 380, 640 500, 900 500 C 980 500, 990 420, 996 378" fill="none" stroke="#b07219" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="700" y="516" font-size="11" fill="#8a5a2b">the only thing the model writes: prose, built from figures the tools returned</text>

  <!-- ============ THE RULE ============ -->
  <rect x="40" y="556" width="1140" height="128" rx="9" fill="#fff" stroke="#d9e1ea" stroke-width="1.5"/>
  <text x="62" y="586" font-size="13" font-weight="700" fill="#0f1720">Why the split</text>
  <text x="62" y="612" font-size="12.5" fill="#3d4a5c">A buyer challenging a supplier has to point at the rule that fired. "The model calculated 8.6%" does not survive that meeting; "your list moved 2.10 to 2.28,</text>
  <text x="62" y="632" font-size="12.5" fill="#3d4a5c">we bought 4,080 units last year, that is 734.40 EUR" does. So every figure comes from <tspan font-family="ui-monospace,Menlo,Consolas,monospace">core/</tspan>, which runs on the standard library with no model,</text>
  <text x="62" y="652" font-size="12.5" fill="#3d4a5c">no network and no key, and is covered by 38 assertions. The browser build of the same logic is checked against the Python one on every run, so the live page</text>
  <text x="62" y="672" font-size="12.5" fill="#3d4a5c">and the agent can never quote different numbers.</text>
</svg>
